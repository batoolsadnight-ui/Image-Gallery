<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperture — Image Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="eyebrow">A Visual Collection</div>
  <h1>Frames worth a <em>second look</em></h1>
  <p> curated gallery </p>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="nature">Nature</button>
  <button class="filter-btn" data-filter="urban">Urban</button>
  <button class="filter-btn" data-filter="portrait">Portrait</button>
  <button class="filter-btn" data-filter="abstract">Abstract</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-frame">
    <button class="icon-btn close-btn" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption">
      <div class="tag" id="lightbox-tag"></div>
      <div class="title" id="lightbox-title"></div>
      <div class="count" id="lightbox-count"></div>
    </div>
    <div class="nav-row">
      <button class="icon-btn" onclick="changeImage(-1)">←</button>
      <button class="icon-btn" onclick="changeImage(1)">→</button>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
